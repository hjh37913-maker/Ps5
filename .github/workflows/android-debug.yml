name: PS5 debug build & emulator smoke test

on:
  push:
    branches: [arena/2fee0bc4-ps5]
    paths:
      - 'android/**'
      - '.github/workflows/android-debug.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  debug:
    name: Build debug APK + run on emulator
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Enable KVM group perms
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          ls -l /dev/kvm

      - name: Install toolchain
        run: |
          set -euo pipefail
          python -m pip install --quiet --upgrade pip
          python -m pip install --quiet Pillow
          mkdir -p /tmp/tc
          curl -fsSL https://registry.npmjs.org/aaptjs3/-/aaptjs3-2.0.2.tgz -o /tmp/tc/aapt.tgz
          mkdir -p /tmp/tc/aapt && tar xzf /tmp/tc/aapt.tgz -C /tmp/tc/aapt --strip-components=1
          curl -fsSL https://registry.npmjs.org/@drxiaozhi/minapk/-/minapk-0.5.1.tgz -o /tmp/tc/minapk.tgz
          mkdir -p /tmp/tc/minapk && tar xzf /tmp/tc/minapk.tgz -C /tmp/tc/minapk --strip-components=1
          chmod +x /tmp/tc/aapt/bin/x64/linux/aapt2
          echo "AAPT2=/tmp/tc/aapt/bin/x64/linux/aapt2" >> "$GITHUB_ENV"
          echo "ECJ=/tmp/tc/minapk/tools/ecj-3.45.0.jar" >> "$GITHUB_ENV"
          echo "D8JAR=/tmp/tc/minapk/tools/d8.jar" >> "$GITHUB_ENV"
          echo "APKSIGNER_JAR=/tmp/tc/minapk/tools/apksigner.jar" >> "$GITHUB_ENV"
          echo "ANDROID_JAR=/tmp/tc/minapk/tools/android.jar" >> "$GITHUB_ENV"

      - name: Build debug APK
        run: bash android/tools/build-ci.sh

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: ps5-debug-apk
          path: dist/*.apk
          if-no-files-found: error

      - name: Emulator smoke test (install, launch, logcat, screenshot)
        id: smoke
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 29
          target: default
          arch: x86_64
          ram-size: 2048M
          cores: 2
          emulator-boot-timeout: 900
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: |
            set +e
            adb install -r dist/PS5MobileSimulator-debug.apk > install.txt 2>&1
            echo "install=$?" > smoke-status.txt
            adb logcat -c
            adb shell am start -n com.kaizer.ps5simulator/.MainActivity > start.txt 2>&1
            echo "am_start=$?" >> smoke-status.txt
            sleep 15
            adb shell input tap 500 300 > tap.txt 2>&1
            echo "tap=$?" >> smoke-status.txt
            sleep 4
            (adb shell dumpsys activity activities | grep -iE 'mResumedActivity|topResumedActivity'; \
             adb shell dumpsys window | grep -i mCurrentFocus) | head -8 > resumed.txt 2>&1
            adb logcat -d -v threadtime > logcat.txt
            echo "logcat=$?" >> smoke-status.txt
            adb exec-out screencap -p > screenshot.png
            echo "screencap=$?" >> smoke-status.txt
            echo "=== install ==="; cat install.txt
            echo "=== am start ==="; cat start.txt
            echo "=== resumed ==="; cat resumed.txt
            echo "=== status ==="; cat smoke-status.txt
            echo "=== crash scan ==="
            if grep -qE 'FATAL EXCEPTION|AndroidRuntime: FATAL' logcat.txt; then
              echo "crash=1" >> smoke-status.txt
              grep -E -A16 'FATAL EXCEPTION|AndroidRuntime: FATAL' logcat.txt | head -100
              exit 1
            fi
            echo "crash=0" >> smoke-status.txt
            if ! grep -q 'Success' install.txt; then echo "INSTALL FAILED"; exit 1; fi
            if ! grep -q 'com.kaizer.ps5simulator' resumed.txt; then echo "ACTIVITY NOT RESUMED"; exit 1; fi
            echo "SMOKE OK"
            exit 0

      - name: Upload logcat + screenshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ps5-debug-logs
          path: |
            logcat.txt
            screenshot.png
          if-no-files-found: warn

      - name: Publish debug results into the repo
        if: always()
        run: |
          set -e
          mkdir -p ci-results
          for f in logcat.txt screenshot.png smoke-status.txt install.txt start.txt resumed.txt tap.txt; do
            [ -f "$f" ] && cp "$f" "ci-results/$f"
          done
          printf 'run_id=%s\nattempt=%s\njob_status=%s\nsmoke=%s\n' \
            "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" "${{ job.status }}" "${{ steps.smoke.outcome }}" \
            > ci-results/result.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ci-results || true
          if ! git diff --cached --quiet; then
            git commit -m "CI debug results (run $GITHUB_RUN_ID)" --quiet
            git pull --rebase origin "$GITHUB_REF_NAME"
            git push origin "HEAD:$GITHUB_REF_NAME"
          else
            echo "no results to publish"
          fi
