name: PS5 debug build & emulator smoke test

on:
  push:
    branches: [arena/2fee0bc4-ps5]
    paths:
      - 'android/**'
      - '.github/workflows/android-debug.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  debug:
    name: Build debug APK + run on emulator
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install toolchain
        run: |
          set -euo pipefail
          python -m pip install --quiet --upgrade pip
          python -m pip install --quiet Pillow
          mkdir -p /tmp/tc
          curl -fsSL https://registry.npmjs.org/aaptjs3/-/aaptjs3-2.0.2.tgz -o /tmp/tc/aapt.tgz
          mkdir -p /tmp/tc/aapt && tar xzf /tmp/tc/aapt.tgz -C /tmp/tc/aapt --strip-components=1
          curl -fsSL https://registry.npmjs.org/@drxiaozhi/minapk/-/minapk-0.5.1.tgz -o /tmp/tc/minapk.tgz
          mkdir -p /tmp/tc/minapk && tar xzf /tmp/tc/minapk.tgz -C /tmp/tc/minapk --strip-components=1
          chmod +x /tmp/tc/aapt/bin/x64/linux/aapt2
          echo "AAPT2=/tmp/tc/aapt/bin/x64/linux/aapt2" >> "$GITHUB_ENV"
          echo "ECJ=/tmp/tc/minapk/tools/ecj-3.45.0.jar" >> "$GITHUB_ENV"
          echo "D8JAR=/tmp/tc/minapk/tools/d8.jar" >> "$GITHUB_ENV"
          echo "APKSIGNER_JAR=/tmp/tc/minapk/tools/apksigner.jar" >> "$GITHUB_ENV"
          echo "ANDROID_JAR=/tmp/tc/minapk/tools/android.jar" >> "$GITHUB_ENV"
          /tmp/tc/aapt/bin/x64/linux/aapt2 version

      - name: Build debug APK
        run: bash android/tools/build-ci.sh

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: ps5-debug-apk
          path: dist/*.apk
          if-no-files-found: error

      - name: Emulator smoke test (install, launch, logcat, screenshot)
        id: smoke
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 33
          target: google_apis
          arch: x86_64
          ram-size: 2048M
          disable-animations: true
          script: |
            set -e
            adb install -r dist/PS5MobileSimulator-debug.apk
            adb logcat -c
            adb shell am start -n com.kaizer.ps5simulator/.MainActivity
            sleep 12
            adb shell input tap 500 300 || true
            sleep 3
            echo "=== resumed activity ==="
            adb shell dumpsys activity activities | grep -iE 'mResumedActivity|topResumedActivity' | head -5 || true
            adb logcat -d -v threadtime > logcat.txt
            adb exec-out screencap -p > screenshot.png
            echo "=== crash scan ==="
            if grep -qE 'FATAL EXCEPTION|AndroidRuntime: FATAL' logcat.txt; then
              grep -E -A14 'FATAL EXCEPTION|AndroidRuntime: FATAL' logcat.txt | head -80
              exit 1
            fi
            echo "NO CRASH DETECTED"

      - name: Upload logcat + screenshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ps5-debug-logs
          path: |
            logcat.txt
            screenshot.png
          if-no-files-found: warn
