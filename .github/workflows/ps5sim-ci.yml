name: ps5sim build + emulator screenshots
on:
  push:
    branches: [arena/e0420214-ps5]
    paths: ['ps5sim/**', '.github/workflows/ps5sim-ci.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: ps5sim
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '21' }
      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm && ls -l /dev/kvm
      - name: Toolchain
        run: |
          set -euo pipefail
          python3 -m pip install --quiet pillow
          bash tools/bootstrap-ci.sh
          echo "JAVA=$(readlink -f "$(which java)")" >> "$GITHUB_ENV"
          echo "KEYTOOL=$(dirname "$(readlink -f "$(which java)")")/keytool" >> "$GITHUB_ENV"
      - name: Build debug APK
        run: |
          set -euo pipefail
          source /tmp/tc/env.sh
          bash tools/build-ci.sh debug
      - uses: actions/upload-artifact@v4
        with:
          name: ps5sim-debug-apk
          path: ps5sim/dist/*.apk
          if-no-files-found: error
      - name: Emulator screenshots
        id: smoke
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 29
          target: default
          arch: x86_64
          ram-size: 2048M
          cores: 2
          emulator-boot-timeout: 900
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          working-directory: ps5sim
          script: bash tools/smoke.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ps5sim-screenshots
          path: |
            ps5sim/shots/*.png
            ps5sim/logcat.txt
            ps5sim/smoke-status.txt
            ps5sim/resumed.txt
            ps5sim/install.txt
          if-no-files-found: warn
      - name: Publish results
        if: always()
        run: |
          set -e
          mkdir -p ../ci-results/shots
          rm -f ../ci-results/shots/*.png
          cp shots/*.png ../ci-results/shots/ 2>/dev/null || true
          cp smoke-status.txt logcat.txt ../ci-results/ 2>/dev/null || true
          printf 'run_id=%s\njob_status=%s\nsmoke=%s\n' "$GITHUB_RUN_ID" "${{ job.status }}" "${{ steps.smoke.outcome }}" > ../ci-results/result.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A ../ci-results || true
          if ! git diff --cached --quiet; then
            git commit -m "CI screenshots (run $GITHUB_RUN_ID)" --quiet
            git pull --rebase origin main || true
            git push origin HEAD:main
          fi
